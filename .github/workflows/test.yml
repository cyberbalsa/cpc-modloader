name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - run: python dist/cpcmodloader.pyz --version
      - run: python -m pip install .
      - run: cpc-modloader --version
  bundle:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            binary: cpc-modloader
          - os: windows-latest
            platform: windows
            binary: cpc-modloader.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pyinstaller==6.11.1
      - run: python -m PyInstaller --clean --onefile --name cpc-modloader --collect-data cpcmodloader scripts/entrypoint.py
      - run: python scripts/check_bundle.py dist/${{ matrix.binary }}
      - run: python scripts/bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: cpc-modloader-${{ matrix.platform }}-x86_64
          path: dist/cpc-modloader-${{ matrix.platform }}-x86_64.zip
